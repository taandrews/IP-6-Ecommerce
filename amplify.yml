# Amplify Hosting build spec (versioned here; takes precedence over the console copy).
#
# Amplify exposes its environment variables to the build only. Server code
# (API routes, server components) runs later on the compute tier, where those
# variables do not exist unless the build writes them into .env.production,
# which Next.js loads at runtime. Only server-side settings are copied; nothing
# here is a secret value (Stripe and other secrets stay in Secrets Manager and
# are read through APP_ENV at runtime).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - env | grep -E '^(APP_ENV|APP_AWS_REGION|DYNAMODB_TABLE_PREFIX|COGNITO_USER_POOL_ID|COGNITO_CLIENT_ID|STAFF_COGNITO_USER_POOL_ID|STAFF_COGNITO_CLIENT_ID|ADMIN_LINK_KEY|S3_ASSETS_BUCKET|CLOUDFRONT_DOMAIN|SES_FROM_EMAIL|SES_CONFIGURATION_SET|PERMITTED_SUPPLEMENT_COUNTRIES|STRIPE_TAX_ENABLED)=' >> .env.production
    build:
      commands:
        # Fails the deploy on any ip-6.net reference or disease-claim language.
        - npm run compliance:check
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
